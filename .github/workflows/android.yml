name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Lint and build debug APK
        run: bash ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnowSeek-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/lint-results-debug.*
          retention-days: 14

  signed-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Signing secrets incomplete; release publication skipped.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signing.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.signing.outputs.ready == 'true'
      - name: Install SDK
        if: steps.signing.outputs.ready == 'true'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.signing.outputs.ready == 'true'
      - name: Build unsigned release
        if: steps.signing.outputs.ready == 'true'
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/snowseek-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist/SnowSeek.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs dist/SnowSeek.apk
          "$tools/zipalign" -c -p 4 dist/SnowSeek.apk
          (cd dist && sha256sum SnowSeek.apk > SnowSeek.apk.sha256)
      - name: Publish verified signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/SnowSeek.apk dist/SnowSeek.apk.sha256 --verify-tag --title "SnowSeek $RELEASE_TAG" --notes "Android-клиент для общения с DeepSeek."
